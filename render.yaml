services:
  # Backend Spring Boot Web Service
  - type: web
    name: supportdesk-api
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true

  # Frontend React/Vite Static Site (Static sites on Render are free by default and do not accept a plan property)
  - type: web
    name: supportdesk-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://supportdesk-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
