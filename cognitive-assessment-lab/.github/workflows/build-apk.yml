name: Build Cognitive Assessment Lab APK
on:
  push:
    branches: [cognitive-assessment-lab]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cognitive-assessment-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-assessment-lab-debug
          path: cognitive-assessment-lab/app/build/outputs/apk/debug/app-debug.apk
