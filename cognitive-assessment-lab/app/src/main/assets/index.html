<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><title>Cognitive Assessment Lab</title>
<style>
:root{--bg:#07111f;--s:#0e1a2c;--s2:#15263d;--s3:#1d3451;--txt:#f4f7fb;--muted:#93a6bd;--a:#6d9cff;--ok:#4ac994;--bad:#e1646c;--board:#eef3f8;--ink:#142033;--line:#c8d2df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,Roboto,system-ui,sans-serif;overscroll-behavior:none}body{padding-bottom:env(safe-area-inset-bottom)}button{font:inherit;border:0;color:inherit;cursor:pointer}button:active{transform:scale(.985)}
.app{max-width:760px;min-height:100vh;margin:auto;padding:15px 16px 28px}.top{display:flex;align-items:center;gap:11px;min-height:48px}.back{width:42px;height:42px;border-radius:13px;background:var(--s2);font-size:26px}.brand{font-size:18px;font-weight:850}.eyebrow{font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}.timer{margin-left:auto;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.hero{padding:22px 2px 15px}.hero h1{font-size:34px;line-height:1.02;letter-spacing:-.04em;margin:0 0 9px}.hero p{font-size:13px;color:var(--muted);line-height:1.5;margin:0}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.chip{padding:7px 10px;border-radius:999px;background:var(--s);font-size:10px;color:#dce6f2}.chip b{color:var(--a)}
.card{background:var(--s);border:1px solid #fff1;border-radius:20px;padding:16px;margin:10px 0}.card h2{font-size:17px;margin:0 0 5px}.card p{font-size:11px;color:var(--muted);line-height:1.45;margin:0}.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px}.pill{background:var(--s2);padding:7px 10px;border-radius:10px;font-size:10px;font-weight:850}.primary,.secondary,.danger{width:100%;padding:14px;border-radius:14px;font-weight:850;margin-top:10px}.primary{background:var(--a);color:#06101e}.secondary{background:var(--s2)}.danger{background:#71353c}
.info{padding:10px 2px}.info h1{font-size:26px;margin:13px 0 8px}.info p{font-size:13px;color:var(--muted);line-height:1.6}.list{list-style:none;padding:0;margin:14px 0}.list li{font-size:12px;color:#dce6f1;padding:9px 0;border-bottom:1px solid #fff1}.list li:before{content:'•';color:var(--a);margin-right:9px;font-weight:900}.game{padding-top:4px}.hud{display:flex;justify-content:space-between;gap:8px;margin:7px 2px 11px}.small{font-size:10px;color:var(--muted)}.progress{height:5px;background:#20344e;border-radius:20px;overflow:hidden;margin-bottom:13px}.progress i{display:block;height:100%;background:var(--a)}
.board{background:var(--board);border-radius:20px;padding:7px;user-select:none}.motion{display:grid;position:relative;aspect-ratio:1;gap:2px;overflow:hidden}.cell{background:#fbfcfe;border:1px solid var(--line);border-radius:5px}.piece{position:absolute;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;box-shadow:0 4px 10px #07111f25;transition:left .13s ease,top .13s ease;touch-action:none}.ball,.goal{position:absolute;border-radius:50%;z-index:5}.ball{width:54%;height:54%;left:23%;top:23%;background:var(--bad)}.goal{width:62%;height:62%;left:19%;top:19%;background:#1c2631;border:4px solid #fff}.note{font-size:11px;color:var(--muted);line-height:1.45;margin:11px 2px}.actions{display:flex;gap:9px}.actions button{flex:1}
.gridboard{display:grid;gap:4px}.gcell{aspect-ratio:1;border:1px solid var(--line);background:#fbfcfe;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0}.dot{width:38%;height:38%;border-radius:50%;background:var(--a)}.mark{width:43%;height:43%;border-radius:50%;background:var(--a);color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}.distractor{background:var(--s);border-radius:18px;padding:17px}.distractor h2{font-size:16px;line-height:1.4;margin:0 0 12px}.figrow{display:flex;gap:10px}.figure{flex:1;aspect-ratio:1;background:var(--board);border-radius:13px;padding:9px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.f{border-radius:4px}.on{background:#2f73df}.yn{display:flex;gap:9px;margin-top:13px}.yn button{flex:1;background:var(--s2);padding:14px;border-radius:13px;font-weight:900}
.question{background:var(--s);border-radius:18px;padding:17px;margin-bottom:11px}.question h2{font-size:16px;line-height:1.4;margin:0 0 10px}.line{font-size:13px;line-height:1.6;color:#dce6f0}.option{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:var(--s2);padding:13px;border-radius:13px;margin:8px 0}.letter{width:29px;height:29px;border-radius:9px;background:#223b5c;display:flex;align-items:center;justify-content:center;color:var(--a);font-weight:900}
.beh{background:var(--s);border-radius:18px;padding:17px}.stmt{font-size:15px;line-height:1.5;padding:7px 0}.vs{text-align:center;color:var(--muted);font-size:9px;letter-spacing:.16em;font-weight:900}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:14px}.scale button{min-height:65px;background:var(--s2);border-radius:11px;font-size:8px;font-weight:850;padding:7px 2px}.scale button.mid{background:var(--s3)}
.metric{background:var(--s);border:1px solid #fff1;border-radius:17px;padding:15px;margin:9px 0}.metric .v{font-size:24px;font-weight:900;margin-top:4px}.metric .k{font-size:10px;color:var(--muted)}.settings-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #fff1;font-size:12px}.toggle{background:var(--s2);border-radius:10px;padding:8px 10px;font-size:9px;font-weight:850}.footer{text-align:center;color:var(--muted);font-size:9px;line-height:1.5;margin:18px 3px}.toast{position:fixed;z-index:50;left:50%;bottom:20px;transform:translateX(-50%);background:#1b2e48;padding:11px 14px;border-radius:12px;font-size:11px;box-shadow:0 8px 30px #0008}.hidden{display:none!important}@media(min-width:700px){.app{padding-left:24px;padding-right:24px}.hero h1{font-size:38px}}
</style></head>
<body><main id="app" class="app"></main><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const CAP={motion:360,grid:720,logic:1500,behaviour:1500},MS=['motion','grid','logic','behaviour'],NAME={motion:'Motion Challenge',grid:'Grid Challenge',logic:'Logical Reasoning',behaviour:'Behavioural Module'};
const DESC={motion:'Planning, obstacle navigation and move efficiency.',grid:'Working memory, spatial attention and ordered recall.',logic:'Deduction, patterns, systems and decision making.',behaviour:'Forced-choice personality practice without right answers.'};
const app=document.getElementById('app'),toastEl=document.getElementById('toast');
let S={screen:'home',module:null,full:false,stage:0,seed:0,rng:null,level:1,score:0,answered:0,correct:0,end:0,timer:null,data:null,total:{score:0,answered:0,correct:0}};
const R=seed=>{let x=(seed>>>0)||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}};const ri=n=>Math.floor(S.rng()*n),pick=a=>a[ri(a.length)];
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function left(){return Math.max(0,Math.ceil((S.end-Date.now())/1000))}
function get(k){return Number(localStorage.getItem('cal3_'+k)||0)}function inc(k){localStorage.setItem('cal3_'+k,String(get(k)+1))}
function toast(s){toastEl.textContent=s;toastEl.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.add('hidden'),1100)}
function stop(){clearInterval(S.timer);S.timer=null}
function startClock(sec){stop();S.end=Date.now()+sec*1000;S.timer=setInterval(()=>{if(Date.now()>=S.end){stop();finish()}render()},200)}
function seed(){S.seed=(Date.now()^Math.floor(Math.random()*0xffffffff))>>>0;S.rng=R(S.seed)}
function shell(title,body){app.innerHTML='<div class="top"><button class="back" onclick="home()">‹</button><div><div class="brand">'+title+'</div><div class="eyebrow">'+(S.full?'FULL SIMULATION':'PRACTICE')+' · '+S.seed.toString(16)+'</div></div>'+(S.end?'<div class="timer">'+fmt(left())+'</div>':'')+'</div>'+body}
function home(){stop();S.screen='home';S.full=false;S.end=0;render()}
function start(m,full=false){stop();seed();S.module=m;S.full=full;S.level=1;S.score=0;S.answered=0;S.correct=0;S.screen=m;S.data=null;generate();startClock(CAP[m]);render()}
function fullStart(){S.full=true;S.stage=0;S.total={score:0,answered:0,correct:0};start('motion',true)}
function finish(){if(!S.full){S.screen='result';S.end=0;render();return}S.total.score+=S.score;S.total.answered+=S.answered;S.total.correct+=S.correct;S.stage++;if(S.stage>=4){S.score=S.total.score;S.answered=S.total.answered;S.correct=S.total.correct;S.full=false;S.end=0;S.screen='result';render();return}S.module=MS[S.stage];S.level=1;S.score=0;S.answered=0;S.correct=0;S.screen=S.module;S.data=null;generate();startClock(CAP[S.module]);render()}
function card(m,t){return '<section class="card"><div class="meta" style="margin:0"><div><h2>'+NAME[m]+'</h2><p>'+DESC[m]+'</p></div><span class="pill">'+t+'</span></div><div class="meta"><span class="small">Procedural practice</span><button class="secondary" style="width:auto;margin:0;padding:10px 14px" onclick="info(\''+m+'\')">Practice</button></div></section>'}
function renderHome(){app.innerHTML='<div class="hero"><h1>Cognitive<br>Assessment Lab</h1><p>Personal offline practice built around the documented cognitive-game mechanics and your Capgemini timing targets.</p><div class="chips"><span class="chip"><b>4</b> modules</span><span class="chip">generated tasks</span><span class="chip">no login</span><span class="chip">local history</span></div></div>'+card('motion','6 MIN')+card('grid','12 MIN')+card('logic','~25 MIN')+card('behaviour','25 MIN')+'<button class="primary" onclick="fullStart()">START FULL SIMULATION</button><button class="secondary" onclick="progress()">VIEW PROGRESS</button><button class="secondary" onclick="settings()">SETTINGS</button><div class="footer">Original practice implementation. Not an official Aon or Capgemini test.</div>'}
function info(m){S.module=m;S.screen='info';render()}
function renderInfo(){const b={motion:['Move constrained blocks along their permitted axis.','Plan the route for the red ball.','Lower move count is more efficient.'],grid:['Memorise sequential dot positions.','Complete a visual distractor.','Recall locations in exact order.'],logic:['Several generated reasoning families.','Each item has one validated answer.','Difficulty increases through constraints.'],behaviour:['Choose which statement describes you more.','There is no correct answer.','Practice feedback is not a hiring score.']}[S.module];shell(NAME[S.module],'<div class="info"><h1>'+NAME[S.module]+'</h1><p>'+DESC[S.module]+'</p><ul class="list">'+b.map(x=>'<li>'+x+'</li>').join('')+'</ul><button class="secondary" onclick="start(\''+S.module+'\',false);S.end=0;stop();toast(\'Untimed example\')">TRY UNTIMED EXAMPLE</button><button class="primary" onclick="start(\''+S.module+'\')">START TIMED PRACTICE</button></div>')}
function progress(){stop();S.screen='progress';render()}function settings(){stop();S.screen='settings';render()}
function renderProgress(){shell('Progress','<div class="info"><h1>Local practice</h1><p>Nothing is uploaded anywhere.</p><div class="metric"><div class="k">Motion boards solved</div><div class="v">'+get('motion')+'</div></div><div class="metric"><div class="k">Grid rounds completed</div><div class="v">'+get('grid')+'</div></div><div class="metric"><div class="k">Logic questions</div><div class="v">'+get('logic')+'</div></div><div class="metric"><div class="k">Behavioural responses</div><div class="v">'+get('beh')+'</div></div><button class="secondary" onclick="home()">BACK</button></div>')}
function renderSettings(){shell('Settings','<div class="info"><h1>Settings</h1><div class="settings-row"><span>Storage</span><span class="toggle">DEVICE ONLY</span></div><div class="settings-row"><span>Gameplay network</span><span class="toggle">NONE</span></div><button class="danger" onclick="resetData()">RESET LOCAL HISTORY</button><button class="secondary" onclick="home()">BACK</button></div>')}
function resetData(){Object.keys(localStorage).filter(k=>k.startsWith('cal3_')).forEach(k=>localStorage.removeItem(k));toast('History reset');setTimeout(settings,300)}
// Motion: solver-validated sliding blocks + ball path.
function occupied(b,ignore=-1){let o=new Set([b.pr+','+b.pc]);b.bs.forEach((x,i)=>{if(i===ignore)return;for(let k=0;k<x.len;k++)o.add((x.r+(x.h?0:k))+','+(x.c+(x.h?k:0)))});return o}
function stateKey(s){return s.pr+','+s.pc+'|'+s.bs.map(x=>x.r+','+x.c).join(';')}
function solve(st){let q=[{pr:st.pr,pc:st.pc,bs:st.bs.map(x=>({...x}))}],d=[0],seen=new Set([stateKey(q[0])]),h=0;while(h<q.length&&q.length<22000){let s=q[h],dist=d[h++];if(s.pr===st.gr&&s.pc===st.gc)return dist;for(let i=0;i<s.bs.length;i++){let b=s.bs[i];for(let dir of[-1,1]){let r=b.r,c=b.c;while(true){if(b.h)c+=dir;else r+=dir;if(r<0||c<0||r+(b.h?1:b.len)>st.rows||c+(b.h?b.len:1)>st.cols)break;let o=occupied(s,i),ok=true;for(let k=0;k<b.len;k++){let rr=r+(b.h?0:k),cc=c+(b.h?k:0);if(o.has(rr+','+cc)){ok=false;break}}if(!ok)break;let bs=s.bs.map(x=>({...x}));bs[i]={...b,r,c};let ns={pr:s.pr,pc:s.pc,bs},kk=stateKey(ns);if(!seen.has(kk)){seen.add(kk);q.push(ns);d.push(dist+1)}}}}let o=occupied(s);for(let [dr,dc] of[[1,0],[-1,0],[0,1],[0,-1]]){let nr=s.pr+dr,nc=s.pc+dc;if(nr>=0&&nc>=0&&nr<st.rows&&nc<st.cols&&!o.has(nr+','+nc)){let ns={pr:nr,pc:nc,bs:s.bs.map(x=>({...x}))},kk=stateKey(ns);if(!seen.has(kk)){seen.add(kk);q.push(ns);d.push(dist+1)}}}}return 999}
function motionGen(){let rows=S.level>=4?6:5,cols=S.level>=3?6:5,count=Math.min(10,4+S.level*2);for(let a=0;a<100;a++){let bs=[];for(let i=0;i<count;i++){let h=S.rng()<.52,len=2+(S.level>=4&&S.rng()<.35?1:0),r=ri(rows),c=ri(cols);if(h)c=Math.min(c,cols-len);else r=Math.min(r,rows-len);let ok=true;for(let k=0;k<len;k++){let rr=r+(h?0:k),cc=c+(h?k:0);if((rr===rows-1&&cc===0)||(rr===0&&cc===cols-1))ok=false;for(let x of bs)for(let z=0;z<x.len;z++)if(rr===x.r+(x.h?0:z)&&cc===x.c+(x.h?z:0))ok=false}if(ok)bs.push({r,c,len,h})}if(bs.length!==count)continue;let b={rows,cols,pr:rows-1,pc:0,gr:0,gc:cols-1,bs,moves:0},opt=solve(b);if(opt>=3+S.level*2&&opt<999){b.opt=opt;return b}}return{rows:5,cols:5,pr:4,pc:0,gr:0,gc:4,bs:[{r:3,c:1,len:2,h:true},{r:1,c:2,len:2,h:false},{r:2,c:3,len:2,h:true},{r:0,c:1,len:2,h:false}],moves:0,opt:7}}
function renderMotion(){let b=S.data,c='';for(let i=0;i<b.rows*b.cols;i++)c+='<div class="cell"></div>';let pcs=b.bs.map((x,i)=>{let l=x.c/b.cols*100,t=x.r/b.rows*100,w=(x.h?x.len:1)/b.cols*100,h=(x.h?1:x.len)/b.rows*100;return '<div class="piece" data-i="'+i+'" style="left:calc('+l+'% + 2px);top:calc('+t+'% + 2px);width:calc('+w+'% - 4px);height:calc('+h+'% - 4px);background:'+['#3e79e5','#e4ae3c','#46ad83','#9b68d4','#db685c','#3da5c2'][i%6]+'">'+(x.h?'↔':'↕')+'</div>'}).join('');let ball='<div class="ball" style="left:calc('+(b.pc/b.cols*100)+'% + '+(50/b.cols-27/b.cols)+'%);top:calc('+(b.pr/b.rows*100)+'% + '+(50/b.rows-27/b.rows)+'%)"></div>';let goal='<div class="goal" style="left:calc('+(b.gc/b.cols*100)+'% + '+(50/b.cols-31/b.cols)+'%);top:calc('+(b.gr/b.rows*100)+'% + '+(50/b.rows-31/b.rows)+'%)"></div>';shell('Motion Challenge','<div class="game"><div class="hud"><span class="small">Level '+S.level+' · planning</span><span class="small">Moves '+b.moves+' · reference '+b.opt+'</span></div><div class="progress"><i style="width:'+(S.level/5*100)+'%"></i></div><div id="mb" class="board motion" style="grid-template-columns:repeat('+b.cols+',1fr);grid-template-rows:repeat('+b.rows+',1fr)">'+c+pcs+ball+goal+'</div><div class="note">Drag blocks along their axis. Tap an adjacent empty cell to move the red ball. Reach the dark target.</div><div class="actions"><button class="secondary" onclick="skipMotion()">SKIP</button><button class="secondary" onclick="resetMotion()">RESET</button></div></div>');wireMotion()}
function canMove(i,nr,nc){let b=S.data,x=b.bs[i];if(nr<0||nc<0||nr+(x.h?1:x.len)>b.rows||nc+(x.h?x.len:1)>b.cols)return false;let o=occupied(b,i);for(let k=0;k<x.len;k++){let r=nr+(x.h?0:k),c=nc+(x.h?k:0);if(o.has(r+','+c))return false}return true}
function wireMotion(){let board=document.getElementById('mb');document.querySelectorAll('.piece').forEach(el=>{let sx=0,sy=0;el.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId)};el.onpointerup=e=>{let i=+el.dataset.i,x=S.data.bs[i],rect=board.getBoundingClientRect(),step=Math.round((x.h?e.clientX-sx:e.clientY-sy)/(rect.width/S.data.cols));if(step){let nr=x.r,nc=x.c;if(x.h)nc+=step;else nr+=step;if(canMove(i,nr,nc)){x.r=nr;x.c=nc;S.data.moves++;checkMotion()}}render()}})}
function checkMotion(){let b=S.data;if(b.pr===b.gr&&b.pc===b.gc){S.answered++;S.correct++;S.score+=Math.max(1,Math.round(100*b.opt/Math.max(b.opt,b.moves)));inc('motion');S.level=Math.min(5,S.level+1);toast('Solved');S.data=motionGen()}}
function resetMotion(){S.data=motionGen();render()}function skipMotion(){S.answered++;S.data=motionGen();render()}
// Grid: sequential memory -> genuine distractor -> ordered recall.
function gridGen(){let n=Math.min(7,4+Math.floor((S.level-1)/2)),dots=Math.min(n+2,3+Math.floor(S.level/1.5)),set=new Set(),seq=[];while(seq.length<dots){let p=ri(n*n);if(!set.has(p)){set.add(p);seq.push(p)}}S.data={n,dots,seq,phase:'show',shown:0,started:Date.now(),distractorCorrect:S.rng()<.5,type:ri(3),selected:[]}}
function fig(seed){let x='';for(let i=0;i<16;i++){let on=((i+seed)%5===0)||((i*3+seed)%7===0);x+='<div class="f '+(on?'on':'')+'"></div>'}return'<div class="figure">'+x+'</div>'}
function renderGrid(){let g=S.data;if(g.phase==='show'){g.shown=Math.min(g.dots,Math.floor((Date.now()-g.started)/850)+1);if(g.shown>=g.dots&&Date.now()-g.started>g.dots*850+500)g.phase='distract';else setTimeout(render,100)}let body='';if(g.phase==='show'){let c='';for(let i=0;i<g.n*g.n;i++)c+='<div class="gcell">'+(g.seq.slice(0,g.shown).includes(i)?'<span class="dot"></span>':'')+'</div>';body='<div class="game"><div class="hud"><span class="small">Level '+S.level+' · memorise</span><span class="small">'+g.shown+'/'+g.dots+'</span></div><div class="board gridboard" style="grid-template-columns:repeat('+g.n+',1fr)">'+c+'</div><div class="note center">Remember each location and its order.</div></div>'}else if(g.phase==='distract'){let q=g.type===0?'Is the second pattern symmetrical?':g.type===1?'Can the second pattern be rotated to match the first?':'Do the visual rules produce the same pattern?';body='<div class="game"><div class="hud"><span class="small">Distractor · switch attention</span><span class="small">YES / NO</span></div><div class="distractor"><h2>'+q+'</h2><div class="figrow">'+fig(1)+fig(g.distractorCorrect?1:3)+'</div><div class="yn"><button onclick="gridDistract(true)">YES</button><button onclick="gridDistract(false)">NO</button></div></div></div>'}else{let c='';for(let i=0;i<g.n*g.n;i++){let p=g.selected.indexOf(i);c+='<button class="gcell" onclick="gridPick('+i+')">'+(p>=0?'<span class="mark">'+(p+1)+'</span>':'')+'</button>'}body='<div class="game"><div class="hud"><span class="small">Recall · original order</span><span class="small">'+g.selected.length+'/'+g.dots+'</span></div><div class="board gridboard" style="grid-template-columns:repeat('+g.n+',1fr)">'+c+'</div><div class="note">Tap the remembered cells in exact order.</div></div>'}shell('Grid Challenge',body)}
function gridDistract(a){let g=S.data;S.answered++;if(a===g.distractorCorrect){S.correct++;S.score+=2}g.phase='recall';render()}
function gridPick(i){let g=S.data;if(g.selected.includes(i))return;let p=g.selected.length;g.selected.push(i);S.answered++;if(i===g.seq[p]){S.correct++;S.score+=3}if(g.selected.length>=g.dots){inc('grid');S.level=Math.min(5,S.level+1);toast('Round complete');gridGen()}render()}
// Logic: several generated families.
function logicGen(){let f=ri(5),text='',correct='',wrong=[];if(f===0){let a=2+ri(7),d=2+ri(5);correct=''+(a+4*d);text='Complete the sequence:\n'+a+', '+(a+d)+', '+(a+2*d)+', '+(a+3*d)+', ?';wrong=[''+(a+4*d-1),''+(a+5*d),''+(a+4*d+1)]}else if(f===1){let n=sh(['A','B','C','D']),a=n[0],b=n[1],c=n[2],d=n[3];correct=a+' → '+b+' → '+d+' → '+c;text='Which order is possible?\n'+a+' before '+b+'. '+c+' after '+b+'. '+d+' before '+c+'.';wrong=[b+' → '+a+' → '+d+' → '+c,d+' → '+a+' → '+b+' → '+c,a+' → '+d+' → '+c+' → '+b]}else if(f===2){correct='A, B, not C';text='Rules:\nIf A is selected, B must be selected.\nIf B is selected, C cannot be selected.\nWhich set is possible?';wrong=['A, not B, C','A, B, C','not A, B, not C']}else if(f===3){let a=2+ri(6),b=2+ri(6),c=1+ri(4);correct=''+(a*b+c);text='Apply the rule:\n'+a+' × '+b+' + '+c+' = ?';wrong=[''+(a*b),''+((a+b)*c),''+(a+b+c)]}else{let x=ri(4),y=ri(4),z=(x+y)%4;correct=''+z;text='A 4-position system applies a cyclic shift.\nInput '+x+' moves forward '+y+' positions.\nWhich position is produced?';wrong=[''+((z+1)%4),''+((z+2)%4),''+((z+3)%4)]}let opts=sh([correct,...wrong]);S.data={f,text,opts,correct:opts.indexOf(correct)}}
function renderLogic(){let q=S.data;shell('Logical Reasoning','<div class="game"><div class="hud"><span class="small">Level '+S.level+' · generated</span><span class="small">one validated answer</span></div><div class="question"><h2>Choose the only valid answer</h2>'+q.text.split('\n').map(x=>'<div class="line">'+esc(x)+'</div>').join('')+'</div>'+q.opts.map((x,i)=>'<button class="option" onclick="logicPick('+i+')"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(x)+'</span></button>').join('')+'</div>')}
function logicPick(i){let q=S.data;S.answered++;inc('logic');if(i===q.correct){S.correct++;S.score+=3;S.level=Math.min(5,S.level+1)}else S.level=Math.max(1,S.level-1);logicGen();render()}
// Behavioural: original forced-choice pairs.
const PAIRS=[['I prefer to keep tasks organised.','I enjoy improvising when plans change.'],['I speak up when I disagree.','I usually avoid conflict when possible.'],['I enjoy meeting unfamiliar people.','I prefer working with people I already know.'],['I continue working until a difficult task is finished.','I switch tasks when progress becomes slow.'],['I notice when other people are uncomfortable.','I focus mainly on the task in front of me.'],['I prefer clear procedures.','I prefer deciding my own method.'],['I enjoy learning unfamiliar approaches.','I prefer refining methods I already understand.'],['I can make decisions with incomplete information.','I prefer to wait for more information.'],['I naturally take the lead when a group is uncertain.','I prefer supporting someone else who is leading.'],['I check details before moving on.','I prefer maintaining momentum and reviewing later.'],['I enjoy exploring several possible solutions.','I prefer choosing a proven approach quickly.'],['I adapt easily when priorities change.','I prefer stable priorities and predictable plans.']];
function behGen(){S.data={pair:pick(PAIRS)}}
function renderBeh(){let b=S.data;shell('Behavioural Module','<div class="game"><div class="hud"><span class="small">Adaptive-style practice</span><span class="small">no correct answer</span></div><div class="beh"><div class="stmt">'+esc(b.pair[0])+'</div><div class="vs">WHICH IS MORE LIKE YOU?</div><div class="stmt">'+esc(b.pair[1])+'</div><div class="scale">'+['Strongly left','Slightly left','Neutral','Slightly right','Strongly right'].map((x,i)=>'<button class="'+(i===2?'mid':'')+'" onclick="behPick('+i+')">'+x+'</button>').join('')+'</div></div><div class="note">Practice formatting only. Do not treat this as an official psychometric score or a guide to manipulating a hiring assessment.</div></div>')}
function behPick(i){S.answered++;S.score++;inc('beh');behGen();render()}
function result(){let pct=S.answered?Math.round(S.correct/S.answered*100):0;shell('Session Complete','<div class="info"><h1>'+ (S.full?'Simulation complete':'Practice complete')+'</h1><p>'+(S.full?'All four modules finished.':'Your timed session ended.')+'</p><div class="metric"><div class="k">Practice points</div><div class="v">'+S.score+'</div><div class="k">Accuracy '+pct+'% · '+S.correct+'/'+S.answered+'</div></div><button class="primary" onclick="start(\''+S.module+'\')">PRACTICE AGAIN</button><button class="secondary" onclick="home()">BACK HOME</button><div class="footer">Practice metrics only — not an official Aon or Capgemini score.</div></div>')}
function generate(){if(S.module==='motion')S.data=motionGen();else if(S.module==='grid')gridGen();else if(S.module==='logic')logicGen();else behGen()}
function render(){if(S.screen==='home')renderHome();else if(S.screen==='info')renderInfo();else if(S.screen==='progress')renderProgress();else if(S.screen==='settings')renderSettings();else if(S.screen==='result')result();else if(S.module==='motion')renderMotion();else if(S.module==='grid')renderGrid();else if(S.module==='logic')renderLogic();else renderBeh()}
render();
</script></body></html>
